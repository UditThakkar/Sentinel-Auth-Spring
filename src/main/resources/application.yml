spring:
  application:
    name: auth-lib
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
    username: ${SPRING_MAIL_USERNAME:sentinal@auth.com}
    password: ${SPRING_MAIL_PASSWORD:sentinal@auth}

auth-api:
  jwtSecret: ${JWT_SECRET:your-secret-key-change-this-in-production-environment}
  jwtExpirationMs: 3600000
  refreshTokenExpirationMs: 604800000
  baseEndpoint: /api/auth
  signinEndpoint: /signin
  signupEndpoint: /signup
  refreshEndpoint: /refresh
  verifyEndpoint: /verify
  forgotPasswordEndpoint: /forgot-password
  resetPasswordEndpoint: /reset-password
  logoutEndpoint: /logout
  frontendUrl: ${FRONTEND_URL:http://localhost:8080}
  appName: AuthLib
  emailFromName: AuthLib Support
  tokenParamName: token
