spring.application.name=auth-lib

spring.datasource.url=jdbc:postgresql://localhost:5432/authdb
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Auth API Configuration
auth-api.jwtSecret=your-secret-key-change-this-in-production-environment
auth-api.jwtExpirationMs=3600000
auth-api.refreshTokenExpirationMs=604800000
auth-api.baseEndpoint=/api/auth
auth-api.signinEndpoint=/signin
auth-api.signupEndpoint=/signup
auth-api.refreshEndpoint=/refresh
